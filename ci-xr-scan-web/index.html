<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>CI XR Scan</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      8th Wall Engine binary (OSS, no license key required).
      Download from https://8th.io/xrjs and place in public/xr.js
      data-preload-chunks="slam" eagerly loads SLAM/world-tracking.
    -->
    <script async src="/xr.js" data-preload-chunks="slam"></script>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* The XR8 canvas fills the screen */
      #camerafeed {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        /* XR8 does NOT resize the canvas itself; eighthwall.ts sets canvas.width/
           height to the physical pixel size before XR8.run(), so the canvas
           intrinsic size matches the viewport and no object-fit scaling is needed. */
        touch-action: none;
      }

      /* AR overlay sits above the canvas */
      #ar-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      /* Capture button */
      #capture-btn {
        pointer-events: all;
        position: absolute;
        bottom: 48px;
        left: 50%;
        transform: translateX(-50%);
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 4px solid #fff;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(4px);
        cursor: pointer;
        transition: transform 0.1s, background 0.1s;
      }

      #capture-btn:active {
        transform: translateX(-50%) scale(0.92);
        background: rgba(255, 255, 255, 0.5);
      }

      #capture-btn.busy {
        pointer-events: none;
        opacity: 0.5;
      }

      /* Label pins */
      .ar-pin {
        position: absolute;
        transform: translate(-50%, -100%);
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 20px;
        white-space: nowrap;
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        pointer-events: none;
      }

      .ar-pin::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        border: 6px solid transparent;
        border-top-color: rgba(0, 0, 0, 0.72);
      }

      /* Status / progress bar */
      #status-bar {
        pointer-events: none;
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.9);
        font-size: 13px;
        text-align: center;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        min-width: 200px;
      }

      #progress-bar-wrap {
        height: 3px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 4px;
        display: none;
      }

      #progress-bar-wrap.visible {
        display: block;
      }

      #progress-bar-fill {
        height: 100%;
        background: #fff;
        border-radius: 2px;
        transition: width 0.3s ease;
        width: 0%;
      }

      /* Side panel */
      #side-panel {
        pointer-events: all;
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 280px;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(12px);
        border-left: 1px solid rgba(255, 255, 255, 0.1);
        transform: translateX(100%);
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
      }

      #side-panel.open {
        transform: translateX(0);
      }

      #panel-toggle {
        pointer-events: all;
        position: absolute;
        right: 16px;
        bottom: 48px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.5);
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      }

      /* Start screen — shown until user taps the button; grants iOS motion permission */
      #start-screen {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(10px);
      }

      #start-ar-btn {
        padding: 16px 52px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #000;
        background: #fff;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.1s, opacity 0.1s;
      }

      #start-ar-btn:active {
        transform: scale(0.94);
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <canvas id="camerafeed"></canvas>

    <!-- Start screen: must be a real button so Safari grants iOS motion permission from the click handler -->
    <div id="start-screen">
      <button id="start-ar-btn">Start AR</button>
    </div>

    <div id="ar-overlay">
      <div id="status-bar">
        <span id="status-text">Initialising…</span>
        <div id="progress-bar-wrap">
          <div id="progress-bar-fill"></div>
        </div>
      </div>
      <button id="capture-btn" aria-label="Capture"></button>
      <button id="panel-toggle" aria-label="Detections">☰</button>
      <div id="side-panel">
        <div id="panel-content"></div>
        <div id="panel-footer"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
