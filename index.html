<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>CI XR Scan</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      8th Wall Engine binary (OSS, no license key required).
      Download from https://8th.io/xrjs and place in public/xr.js
      data-preload-chunks="slam" eagerly loads SLAM/world-tracking.
    -->
    <script async src="/xr.js" data-preload-chunks="slam"></script>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* The XR8 canvas fills the screen */
      #camerafeed {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        /* XR8 does NOT resize the canvas itself; eighthwall.ts sets canvas.width/
           height to the physical pixel size before XR8.run(), so the canvas
           intrinsic size matches the viewport and no object-fit scaling is needed. */
        touch-action: none;
      }

      /* AR overlay sits above the canvas */
      #ar-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      /* Capture button */
      #capture-btn {
        pointer-events: all;
        position: absolute;
        bottom: 48px;
        left: 50%;
        transform: translateX(-50%);
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 4px solid #fff;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(4px);
        cursor: pointer;
        transition: transform 0.1s, background 0.1s;
      }

      #capture-btn:active {
        transform: translateX(-50%) scale(0.92);
        background: rgba(255, 255, 255, 0.5);
      }

      #capture-btn.busy {
        pointer-events: none;
        opacity: 0.5;
      }

      /* ── History button + drawer ── */
      #history-btn {
        pointer-events: all;
        position: absolute;
        right: 16px;
        bottom: 200px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        transition: border-color 0.2s, background 0.2s;
      }
      #history-btn:active { background: rgba(255, 255, 255, 0.15); }

      /* ── Auto-capture button ── */
      #auto-capture-btn {
        pointer-events: all;
        position: absolute;
        right: 16px;
        bottom: 260px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        transition: border-color 0.2s, background 0.2s;
        position: absolute;
      }
      #auto-capture-btn:active { background: rgba(255, 255, 255, 0.15); }
      #auto-capture-btn.active {
        background: rgba(79, 195, 247, 0.25);
        border-color: #4fc3f7;
        color: #4fc3f7;
      }
      /* Pulsing ring when auto-capture is in-flight */
      #capture-btn.auto-busy::after {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 2px solid #4fc3f7;
        animation: auto-ring 1s ease-out infinite;
        pointer-events: none;
      }
      @keyframes auto-ring {
        0%   { transform: scale(1);   opacity: 0.8; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      #auto-capture-count {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 17px;
        height: 17px;
        border-radius: 9px;
        background: #4fc3f7;
        color: #000;
        font-size: 10px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 3px;
        display: none;
      }
      #auto-capture-btn.active #auto-capture-count { display: flex; }

      /* ── Desktop viewer link ── */
      #viewer-link {
        pointer-events: all;
        position: absolute;
        right: 16px;
        bottom: 320px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.6);
        color: rgba(255, 255, 255, 0.7);
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        text-decoration: none;
        transition: border-color 0.2s, background 0.2s, color 0.2s;
      }
      #viewer-link:hover, #viewer-link:active {
        background: rgba(79, 195, 247, 0.18);
        border-color: #4fc3f7;
        color: #4fc3f7;
      }

      /* Full-screen backdrop + slide-in drawer */
      #history-drawer {
        pointer-events: none;
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(0, 0, 0, 0);
        transition: background 0.3s;
      }
      #history-drawer.open {
        pointer-events: all;
        background: rgba(0, 0, 0, 0.5);
      }
      #history-panel {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 300px;
        background: rgba(10, 12, 20, 0.96);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        transform: translateX(-100%);
        transition: transform 0.32s cubic-bezier(0.32, 0, 0.67, 0);
      }
      #history-drawer.open #history-panel {
        transform: translateX(0);
        transition: transform 0.35s cubic-bezier(0.34, 1.1, 0.64, 1);
      }
      #history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 16px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
      }
      #history-title {
        color: #fff;
        font-size: 16px;
        font-weight: 700;
      }
      #history-close {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.4);
        font-size: 18px;
        cursor: pointer;
        padding: 0;
        line-height: 1;
      }
      #history-body {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .ar-pin-wrap {
        position: absolute;
        pointer-events: none;
        will-change: transform, opacity;
      }

      @keyframes pin-pop {
        0%   { opacity: 0; transform: scale(0.55) translateY(10px); }
        60%  { transform: scale(1.08) translateY(-2px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }

      .ar-pin-wrap.entering {
        animation: pin-pop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      .ar-pin-line {
        position: absolute;
        top: 0; left: 0;
        width: 1px;
        transform-origin: top left;
        pointer-events: none;
      }

      /* Status / progress bar */
      #status-bar {
        pointer-events: none;
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.9);
        font-size: 13px;
        text-align: center;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        min-width: 200px;
      }

      #progress-bar-wrap {
        height: 3px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 4px;
        display: none;
      }

      #progress-bar-wrap.visible {
        display: block;
      }

      #progress-bar-fill {
        height: 100%;
        background: #fff;
        border-radius: 2px;
        transition: width 0.3s ease;
        width: 0%;
      }

      /* Side panel */
      #side-panel {
        pointer-events: all;
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 280px;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(12px);
        border-left: 1px solid rgba(255, 255, 255, 0.1);
        transform: translateX(100%);
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
      }

      #side-panel.open {
        transform: translateX(0);
      }

      #panel-toggle {
        pointer-events: all;
        position: absolute;
        right: 16px;
        bottom: 140px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        transition: border-color 0.2s, background 0.2s;
      }

      #panel-toggle:active {
        background: rgba(255, 255, 255, 0.15);
      }

      /* Badge showing object count */
      #panel-toggle[data-count]:not([data-count=''])::after {
        content: attr(data-count);
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 18px;
        height: 18px;
        border-radius: 9px;
        background: #4fc3f7;
        color: #000;
        font-size: 11px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
      }

      /* Panel content scroll */
      #panel-content {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* Panel footer buttons */
      #panel-footer {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      .panel-btn-primary {
        width: 100%;
        padding: 13px;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .panel-btn-primary:active { opacity: 0.75; }

      .panel-btn-ghost {
        width: 100%;
        padding: 10px;
        background: rgba(255, 255, 255, 0.07);
        color: rgba(255, 255, 255, 0.55);
        border: none;
        border-radius: 10px;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .panel-btn-ghost:active { background: rgba(255, 255, 255, 0.13); }

      /* ── Inference summary dialog (bottom-left) ── */
      #infer-dialog {
        pointer-events: all;
        position: absolute;
        left: 12px;
        bottom: 12px;
        width: 272px;
        background: rgba(0, 0, 0, 0.82);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        transform: translateY(120%);
        transition: transform 0.35s cubic-bezier(0.34, 1.36, 0.64, 1), opacity 0.3s;
        opacity: 0;
        z-index: 12;
      }

      #infer-dialog.visible {
        transform: translateY(0);
        opacity: 1;
      }

      #infer-dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 14px 9px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      #infer-dialog-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: rgba(255, 255, 255, 0.45);
      }

      #infer-dialog-close {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.35);
        font-size: 14px;
        cursor: pointer;
        padding: 0 2px;
        line-height: 1;
        pointer-events: all;
      }

      #infer-dialog-body {
        padding: 10px 14px 13px;
        max-height: 220px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* Start screen — shown until user taps the button; grants iOS motion permission */
      #start-screen {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(10px);
      }

      #start-ar-btn {
        padding: 16px 52px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #000;
        background: #fff;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.1s, opacity 0.1s;
      }

      #start-ar-btn:active {
        transform: scale(0.94);
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <canvas id="camerafeed"></canvas>

    <!-- Start screen: must be a real button so Safari grants iOS motion permission from the click handler -->
    <div id="start-screen">
      <button id="start-ar-btn">Start AR</button>
    </div>

    <div id="ar-overlay">
      <div id="status-bar">
        <span id="status-text">Initialising…</span>
        <span id="scan-stats" style="color:rgba(255,255,255,0.5);font-size:11px;margin-left:8px;"></span>
        <div id="progress-bar-wrap">
          <div id="progress-bar-fill"></div>
        </div>
      </div>
      <button id="capture-btn" aria-label="Capture"></button>
      <button id="panel-toggle" aria-label="Detections" data-count="">☰</button>
      <button id="history-btn" aria-label="Session history">🕒</button>
      <button id="auto-capture-btn" aria-label="Auto-capture" title="Enable auto-capture">
        📷
        <span id="auto-capture-count"></span>
      </button>
      <a href="/viewer.html" id="viewer-link" aria-label="Open 3D Viewer" title="Desktop 3D Viewer">🖥</a>
      <button id="rtc-stream-btn" aria-label="Stream to viewer" title="Stream live to desktop viewer"
        style="position:absolute;bottom:20px;left:50%;transform:translateX(-100px);
               background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.2);
               border-radius:22px;padding:6px 14px;color:rgba(255,255,255,0.6);
               font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;z-index:20;">
        <span id="rtc-stream-badge" style="font-size:10px;">◌ RTC</span> Stream
      </button>

      <!-- Scan quality overlay — top-right corner, shown once scanning starts -->
      <div id="quality-overlay" style="display:none;position:absolute;top:16px;right:16px;flex-direction:column;gap:6px;pointer-events:none;z-index:10;">
        <!-- Coverage bar -->
        <div style="background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:8px 12px;min-width:150px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
            <span style="font-size:10px;color:rgba(255,255,255,0.5);font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">Coverage</span>
            <span id="quality-coverage-text" style="font-size:11px;color:rgba(255,255,255,0.7);"></span>
          </div>
          <div style="height:5px;background:rgba(255,255,255,0.12);border-radius:3px;overflow:hidden;">
            <div id="quality-coverage-fill" style="height:100%;width:0%;border-radius:3px;transition:width 0.5s ease,background 0.5s ease;background:#ef5350;"></div>
          </div>
        </div>
        <!-- Warning badges -->
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
          <div id="quality-drift-badge" style="display:none;align-items:center;gap:4px;background:rgba(255,152,0,0.85);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;color:#000;"></div>
          <div id="quality-light-badge" style="display:none;align-items:center;gap:4px;background:rgba(33,33,33,0.9);border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;color:#fff;">🌑 Low light</div>
          <div id="quality-refl-badge"  style="display:none;align-items:center;gap:4px;background:rgba(79,195,247,0.85);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;color:#000;">✦ Reflective</div>
        </div>
        <div id="quality-missing" style="display:none;text-align:right;font-size:10px;color:rgba(255,180,0,0.85);font-weight:600;"></div>
      </div>
      <div id="side-panel">
        <div id="panel-content"></div>
        <div id="panel-footer"></div>
      </div>

      <!-- Inference summary dialog — bottom-left; updated after each capture -->
      <div id="infer-dialog">
        <div id="infer-dialog-header">
          <span id="infer-dialog-title">Latest scan</span>
          <button id="infer-dialog-close" aria-label="Close">✕</button>
        </div>
        <div id="infer-dialog-body"></div>
      </div>
    </div>

    <!-- Session history drawer (slides in from left) -->
    <div id="history-drawer">
      <div id="history-panel">
        <div id="history-header">
          <span id="history-title">Session History</span>
          <button id="history-close" aria-label="Close history">✕</button>
        </div>
        <div id="history-body"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
