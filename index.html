<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Companion Scan</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <meta name="theme-color" content="#010d0e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Companion Scan" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Leaflet for geo map in session history drawer -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!--
      8th Wall Engine binary (OSS, no license key required).
      Download from https://8th.io/xrjs and place in public/xr.js
      data-preload-chunks="slam" eagerly loads SLAM/world-tracking.
    -->
    <script async src="/xr.js" data-preload-chunks="slam"></script>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #010d0e;
        color: #eff0f0;
        font-family: 'Source Code Pro', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
      }

      /* The XR8 canvas fills the screen */
      #camerafeed {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        /* XR8 does NOT resize the canvas itself; eighthwall.ts sets canvas.width/
           height to the physical pixel size before XR8.run(), so the canvas
           intrinsic size matches the viewport and no object-fit scaling is needed. */
        touch-action: none;
      }

      /* AR overlay sits above the canvas */
      #ar-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      /* Capture button */
      #capture-btn {
        pointer-events: all;
        position: absolute;
        bottom: calc(38px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 4px solid #fff;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(4px);
        cursor: pointer;
        transition: transform 0.1s, background 0.1s;
      }

      #capture-btn:active {
        transform: translateX(-50%) scale(0.92);
        background: rgba(255, 255, 255, 0.5);
      }

      #capture-btn.busy {
        pointer-events: none;
        opacity: 0.5;
      }

      /* ── History button + drawer ── */
      #history-btn {
        pointer-events: all;
        position: absolute;
        right: max(16px, env(safe-area-inset-right));
        bottom: calc(70px + env(safe-area-inset-bottom));
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 28px rgba(0,0,0,0.28);
        transition: border-color 0.2s, background 0.2s, transform 0.15s;
      }
      #history-btn:active { background: rgba(255, 255, 255, 0.15); transform: scale(0.94); }

      /* ── Auto-capture button ── */
      #auto-capture-btn {
        pointer-events: all;
        position: absolute;
        right: max(16px, env(safe-area-inset-right));
        bottom: calc(130px + env(safe-area-inset-bottom));
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 28px rgba(0,0,0,0.28);
        transition: border-color 0.2s, background 0.2s, transform 0.15s;
      }
      #auto-capture-btn:active { background: rgba(255, 255, 255, 0.15); transform: scale(0.94); }
      #auto-capture-btn.active {
        background: rgba(128,255,225, 0.25);
        border-color: #80ffe1;
        color: #80ffe1;
      }
      /* Pulsing ring when auto-capture is in-flight */
      #capture-btn.auto-busy::after {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 2px solid #80ffe1;
        animation: auto-ring 1s ease-out infinite;
        pointer-events: none;
      }
      @keyframes auto-ring {
        0%   { transform: scale(1);   opacity: 0.8; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      #auto-capture-count {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 17px;
        height: 17px;
        border-radius: 9px;
        background: #80ffe1;
        color: #000;
        font-size: 10px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 3px;
        display: none;
      }
      #auto-capture-btn.active #auto-capture-count { display: flex; }

      /* ── Desktop viewer link ── */
      #viewer-link {
        pointer-events: all;
        position: absolute;
        right: max(16px, env(safe-area-inset-right));
        bottom: calc(190px + env(safe-area-inset-bottom));
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.6);
        color: rgba(255, 255, 255, 0.7);
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 28px rgba(0,0,0,0.28);
        text-decoration: none;
        transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.15s;
      }
      #viewer-link:hover, #viewer-link:active {
        background: rgba(128,255,225, 0.18);
        border-color: #80ffe1;
        color: #80ffe1;
        transform: scale(0.94);
      }

      /* Full-screen backdrop + slide-in drawer */
      #history-drawer {
        pointer-events: none;
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(0, 0, 0, 0);
        transition: background 0.3s;
      }
      #history-drawer.open {
        pointer-events: all;
        background: rgba(0, 0, 0, 0.5);
      }
      #history-panel {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 390px;
        background: rgba(9,24,24, 0.96);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        transform: translateX(-100%);
        transition: transform 0.32s cubic-bezier(0.32, 0, 0.67, 0);
      }
      #history-drawer.open #history-panel {
        transform: translateX(0);
        transition: transform 0.35s cubic-bezier(0.34, 1.1, 0.64, 1);
      }

      /* Mini geo-map inside the drawer */
      #geo-map-container {
        flex-shrink: 0;
        height: 180px;
        position: relative;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: #091818;
      }
      #geo-map {
        width: 100%;
        height: 100%;
      }
      #geo-map-label {
        position: absolute;
        top: 8px;
        left: 10px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: rgba(255,255,255,0.5);
        pointer-events: none;
        z-index: 1;
        background: rgba(0,0,0,0.45);
        padding: 2px 7px;
        border-radius: 4px;
        backdrop-filter: blur(6px);
      }
      #geo-map-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: rgba(255,255,255,0.2);
        font-size: 12px;
        flex-direction: column;
        gap: 6px;
      }
      #history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 16px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
      }
      #history-title {
        color: #fff;
        font-size: 16px;
        font-weight: 700;
      }
      #history-close {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.4);
        font-size: 18px;
        cursor: pointer;
        padding: 0;
        line-height: 1;
      }
      #history-body {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .ar-pin-wrap {
        position: absolute;
        pointer-events: none;
        will-change: transform, opacity;
      }

      @keyframes pin-pop {
        0%   { opacity: 0; transform: scale(0.55) translateY(10px); }
        60%  { transform: scale(1.08) translateY(-2px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }

      .ar-pin-wrap.entering {
        animation: pin-pop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      .ar-pin-line {
        position: absolute;
        top: 0; left: 0;
        width: 1px;
        transform-origin: top left;
        pointer-events: none;
      }

      #geo-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      #compass-ring {
        position: relative;
        width: 36px;
        height: 36px;
        flex-shrink: 0;
      }
      #compass-ring svg {
        width: 100%;
        height: 100%;
      }
      #compass-needle {
        transition: transform 0.4s ease-out;
      }
      #geo-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        overflow: hidden;
      }
      #geo-address {
        font-size: 10px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.85);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 130px;
      }
      #geo-coords {
        font-size: 9px;
        color: rgba(255, 255, 255, 0.4);
        font-family: monospace;
        white-space: nowrap;
      }
      #geo-accuracy {
        font-size: 9px;
        color: rgba(255, 255, 255, 0.3);
      }

      /* ── Unified top-left HUD panel ── */
      #hud-panel {
        position: absolute;
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        width: min(280px, calc(100vw - 28px - env(safe-area-inset-left) - env(safe-area-inset-right)));
        display: flex;
        flex-direction: column;
        background: rgba(1,13,14,0.68);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(239,240,240,0.12);
        border-radius: 14px;
        overflow: hidden;
        pointer-events: none;
        z-index: 12;
        box-shadow: 0 12px 42px rgba(0,0,0,0.38);
      }

      /* 1 — Status row */
      #status-bar {
        padding: 10px 11px 9px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 12px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      #status-main {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        gap: 9px;
        align-items: center;
      }
      #status-copy {
        min-width: 0;
      }
      #status-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 4px;
      }
      #scan-stats {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.4);
        white-space: nowrap;
        flex-shrink: 0;
      }

      #progress-bar-wrap {
        height: 3px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 8px;
        display: none;
      }
      #progress-bar-wrap.visible { display: block; }

      #progress-bar-fill {
        height: 100%;
        background: #fff;
        border-radius: 2px;
        transition: width 0.3s ease;
        width: 0%;
      }

      /* Indeterminate sweep while analysing */
      @keyframes analyze-sweep {
        0%   { margin-left: -55%; width: 45%; }
        100% { margin-left: 110%; width: 45%; }
      }
      #progress-bar-fill.analyzing {
        width: 45% !important;
        transition: none;
        background: #80ffe1;
        animation: analyze-sweep 1.1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* 2 — Coverage / quality section */
      #quality-overlay {
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        padding: 7px 11px 8px;
        flex-direction: column;
        gap: 5px;
        /* display toggled none/flex by JS */
      }

      #autosave-status {
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        padding: 6px 11px;
        color: rgba(239,240,240,0.45);
        font-size: 10px;
        line-height: 1.4;
      }

      /* 3 — RTC LIVE row */
      #rtc-stream-btn {
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        border-left: none;
        border-right: none;
        border-bottom: none;
        padding: 5px 10px;
        background: none;
        color: #66bb6a;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        pointer-events: all;
        text-align: left;
        align-items: center;
        gap: 6px;
        width: 100%;
        /* display toggled none/flex by JS */
      }

      /* 4 — Latest scan preview */
      #infer-dialog {
        overflow: hidden;
        max-height: 0;
        transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
      }
      #infer-dialog.visible {
        max-height: 260px;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        pointer-events: all;
      }
      #infer-dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px 5px;
      }
      #infer-dialog-title {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.4);
      }
      #infer-dialog-close {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.35);
        font-size: 13px;
        cursor: pointer;
        padding: 0 2px;
        line-height: 1;
        pointer-events: all;
      }
      #infer-dialog-body {
        padding: 0 10px 8px;
        max-height: 180px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.85);
      }

      /* Side panel */
      #side-panel {
        pointer-events: all;
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 280px;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(12px);
        border-left: 1px solid rgba(255, 255, 255, 0.1);
        transform: translateX(100%);
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
        z-index: 15;
      }

      #side-panel.open {
        transform: translateX(0);
      }

      #panel-toggle {
        pointer-events: all;
        position: absolute;
        right: max(16px, env(safe-area-inset-right));
        bottom: calc(250px + env(safe-area-inset-bottom));
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 28px rgba(0,0,0,0.28);
        transition: border-color 0.2s, background 0.2s, transform 0.15s;
      }

      #panel-toggle:active {
        background: rgba(255, 255, 255, 0.15);
        transform: scale(0.94);
      }

      /* Badge showing object count */
      #panel-toggle[data-count]:not([data-count=''])::after {
        content: attr(data-count);
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 18px;
        height: 18px;
        border-radius: 9px;
        background: #80ffe1;
        color: #000;
        font-size: 11px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
      }

      /* Panel content scroll */
      #panel-content {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* Panel footer buttons */
      #panel-footer {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      .panel-btn-primary {
        width: 100%;
        min-height: 44px;
        padding: 12px 14px;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .panel-btn-primary:active { opacity: 0.75; }

      .panel-btn-ghost {
        width: 100%;
        min-height: 40px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.07);
        color: rgba(255, 255, 255, 0.55);
        border: none;
        border-radius: 9px;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .panel-btn-ghost:active { background: rgba(255, 255, 255, 0.13); }



      /* Start screen — shown until user taps the button; grants iOS motion permission */
      #start-screen {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background:
          linear-gradient(180deg, rgba(9,24,24,0.9), rgba(1,13,14,0.96)),
          repeating-linear-gradient(90deg, rgba(128,255,225,0.08) 0 1px, transparent 1px 14px);
        backdrop-filter: blur(10px);
        padding: 24px;
      }

      #start-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 10px;
        max-width: 320px;
      }

      #start-brand-mark {
        width: 54px;
        height: 54px;
        border: 1px solid rgba(239,240,240,0.42);
        border-radius: 50%;
        position: relative;
        box-shadow: 0 0 34px rgba(128,255,225,0.22);
      }

      #start-brand-mark::before,
      #start-brand-mark::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(239,240,240,0.36);
      }

      #start-brand-mark::before {
        inset: 8px;
      }

      #start-brand-mark::after {
        width: 18px;
        height: 18px;
        right: 7px;
        top: 17px;
        background: #80ffe1;
        border-color: #80ffe1;
      }

      #start-eyebrow {
        color: #80ffe1;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      #start-title {
        color: #eff0f0;
        font-size: clamp(34px, 12vw, 58px);
        line-height: 0.95;
        font-weight: 400;
        letter-spacing: 0;
      }

      #start-subtitle {
        color: rgba(239,240,240,0.68);
        font-size: 12px;
        line-height: 1.55;
      }

      #start-ar-btn {
        padding: 16px 52px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #010d0e;
        background: #80ffe1;
        border: 1px solid rgba(239,240,240,0.68);
        border-radius: 50px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.1s, opacity 0.1s, box-shadow 0.15s;
        box-shadow: 0 0 28px rgba(128,255,225,0.28);
      }

      #start-ar-btn:active {
        transform: scale(0.94);
        opacity: 0.85;
      }

      /* Leaflet dark-mode overrides */
      .leaflet-container { background: #091818 !important; font-family: inherit; }
      .leaflet-control-zoom a { background: rgba(20,22,32,0.9) !important; color: #fff !important; border-color: rgba(255,255,255,0.1) !important; }
      .leaflet-control-attribution { background: rgba(0,0,0,0.5) !important; color: rgba(255,255,255,0.3) !important; font-size: 9px !important; }
      .leaflet-control-attribution a { color: rgba(255,255,255,0.4) !important; }
      .leaflet-control-zoom { display: none; } /* hide zoom in small map */

      @keyframes rtc-live-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.35; transform: scale(0.7); }
      }
    </style>
  </head>
  <body>
    <canvas id="camerafeed"></canvas>

    <!-- Start screen: must be a real button so Safari grants iOS motion permission from the click handler -->
    <div id="start-screen">
      <div id="start-brand" aria-hidden="true">
        <div id="start-brand-mark"></div>
        <div id="start-eyebrow">Companion Intelligence</div>
        <div id="start-title">Companion Scan</div>
        <div id="start-subtitle">Private spatial memory for places you own.</div>
      </div>
      <button id="start-ar-btn">Start AR</button>
    </div>

    <div id="ar-overlay">

      <div id="hud-panel">

        <!-- 1. Status, compass, and progress bar -->
        <div id="status-bar">
          <div id="status-main">
            <div id="compass-ring">
              <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="14" cy="14" r="13" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
                <line x1="14" y1="1.5" x2="14" y2="4" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
                <line x1="14" y1="24" x2="14" y2="26.5" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
                <line x1="1.5" y1="14" x2="4" y2="14" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
                <line x1="24" y1="14" x2="26.5" y2="14" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
                <g id="compass-needle" style="transform-origin:14px 14px">
                  <polygon points="14,3 15.4,14 14,12 12.6,14" fill="#80ffe1"/>
                  <polygon points="14,25 15.4,14 14,16 12.6,14" fill="rgba(255,255,255,0.4)"/>
                </g>
                <text x="13" y="11" font-size="4" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-weight="700">N</text>
              </svg>
            </div>
            <div id="status-copy">
              <div id="status-row">
                <span id="status-text">Initialising…</span>
                <span id="scan-stats"></span>
              </div>
              <div id="geo-chip">
                <div id="geo-text">
                  <span id="geo-address">Locating…</span>
                  <span id="geo-coords">Compass waiting</span>
                </div>
              </div>
            </div>
          </div>
          <div id="progress-bar-wrap">
            <div id="progress-bar-fill"></div>
          </div>
        </div>

        <!-- 2. Coverage + quality warnings -->
        <div id="quality-overlay" style="display:none;">
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="font-size:10px;color:rgba(255,255,255,0.4);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;flex-shrink:0;">Cov</span>
            <div style="flex:1;height:4px;background:rgba(255,255,255,0.12);border-radius:2px;overflow:hidden;">
              <div id="quality-coverage-fill" style="height:100%;width:0%;border-radius:2px;transition:width 0.5s ease,background 0.5s ease;background:#ef5350;"></div>
            </div>
            <span id="quality-coverage-text" style="font-size:10px;color:rgba(255,255,255,0.6);min-width:26px;text-align:right;"></span>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;">
            <div id="quality-drift-badge"  style="display:none;align-items:center;background:rgba(255,152,0,0.9);border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;color:#000;"></div>
            <div id="quality-light-badge"  style="display:none;align-items:center;background:rgba(40,40,40,0.9);border:1px solid rgba(255,255,255,0.18);border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;color:#fff;">🌑 Low light</div>
            <div id="quality-refl-badge"   style="display:none;align-items:center;background:rgba(128,255,225,0.9);border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;color:#000;">✦ Refl</div>
          </div>
          <div id="quality-missing" style="display:none;font-size:10px;color:rgba(255,180,0,0.85);font-weight:600;margin-top:2px;"></div>
        </div>

        <div id="autosave-status">Autosave ready</div>

        <!-- 3. RTC LIVE row -->
        <button id="rtc-stream-btn" style="display:none;" aria-label="Stop live stream" title="Tap to stop streaming">
          <span id="rtc-stream-badge" style="width:7px;height:7px;border-radius:50%;background:#66bb6a;display:inline-block;animation:rtc-live-pulse 1.2s ease-in-out infinite;flex-shrink:0;"></span>
          LIVE · tap to stop
        </button>

        <!-- 4. Latest scan preview -->
        <div id="infer-dialog">
          <div id="infer-dialog-header">
            <span id="infer-dialog-title">Latest scan</span>
            <button id="infer-dialog-close" aria-label="Close">✕</button>
          </div>
          <div id="infer-dialog-body"></div>
        </div>

      </div>

      <button id="capture-btn" aria-label="Capture"></button>
      <button id="panel-toggle" aria-label="Detections" data-count="">☰</button>
      <button id="history-btn" aria-label="Session history">🕒</button>
      <button id="auto-capture-btn" aria-label="Auto-capture" title="Enable auto-capture">
        📷
        <span id="auto-capture-count"></span>
      </button>
      <a href="/viewer.html" id="viewer-link" aria-label="Open Companion Scan editor" title="Companion Scan editor">🖥</a>

      <div id="side-panel">
        <div id="panel-content"></div>
        <div id="panel-footer"></div>
      </div>

    </div>

    <!-- Session history drawer (slides in from left) -->
    <div id="history-drawer">
      <div id="history-panel">
        <div id="history-header">
          <span id="history-title">Scan Memory</span>
          <button id="history-close" aria-label="Close history">✕</button>
        </div>
        <!-- Mini Leaflet geomap -->
        <div id="geo-map-container">
          <div id="geo-map-label">📍 Scan locations</div>
          <div id="geo-map"></div>
          <div id="geo-map-placeholder">
            <span style="font-size:24px;opacity:0.3">🗺</span>
            <span>Acquiring location…</span>
          </div>
        </div>
        <div id="history-body"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
