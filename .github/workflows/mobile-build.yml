name: Mobile Build

# Debug artifacts for device QA, kept for 14 days: an Android debug APK, signed with the runner's
# own debug key, and an unsigned iOS Simulator app. This does not upload to Google Play or App
# Store Connect, and it publishes nothing: native-release.yml makes the GitHub pre-release with a
# release APK. Scan AR capture has not run on a phone yet; mobile/README.md lists the gates.
#
# No VITE_API_BASE: the app asks for the person's own Scan server, and no address, key or
# secret is built in.
on:
  workflow_dispatch:

permissions:
  contents: read

# onnxruntime-node's install script downloads a CUDA build from the onnxruntime GitHub release page on Linux x64, and that file
# (v1.21.0, onnxruntime-linux-x64-gpu-1.21.0.tgz) now answers 404, which fails every `npm ci` on a Linux runner. No job here runs a
# model, so none needs the CUDA execution provider: skipping it is what the installer's own switch is for.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install web dependencies
        run: npm ci
      - name: Install Android shell dependencies
        run: npm ci --prefix mobile
      # Both need only the packages installed above. test:android-lockfile checks that
      # app/gradle.lockfile pins every library app/build.gradle declares, and that every library it
      # pins has a licence entry. It goes first: the first failure ends the step, and this one
      # names the library and the fix. test:notices runs the mobile notices generation, which
      # gives every library in the lock its licence text.
      - name: Check the Android dependency lock and the third-party notices
        run: |
          npm run test:android-lockfile
          npm run test:notices
      - name: Check shell config, app versions and the XR Engine files
        run: |
          npm run test:native --prefix mobile
          node scripts/native/check-versions.mjs
          node scripts/native/check-xr-engine.mjs
      - name: Build the web app and sync it into the Android project
        run: |
          npm run build:web --prefix mobile
          cd mobile && npx cap sync android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK packages (the runner's own SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0" > /dev/null
      # The debug build below is not locked, but the release build is (app/build.gradle), so only
      # a Gradle run can show that app/gradle.lockfile is right. --write-locks has Gradle resolve
      # the release classpath afresh and rewrite the file: any change it makes is drift.
      - name: Check the release dependency lock against Gradle
        working-directory: mobile/android
        run: |
          # Paths here are relative to mobile/android. One that matched nothing would let the
          # git diff below pass whatever Gradle wrote.
          git ls-files --error-unmatch app/gradle.lockfile > /dev/null
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --write-locks --no-daemon
          if ! git diff --exit-code -- app/gradle.lockfile; then
            echo "::error::mobile/android/app/gradle.lockfile is out of date: Native Release builds with it and fails when it is wrong. The diff above is what Gradle changed. Run npm run build in mobile/ (the web build, then cap sync), then ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --write-locks in mobile/android, and commit app/gradle.lockfile. A library it adds also needs an entry in ANDROID_LICENCES in scripts/native/third-party-notices.mjs."
            exit 1
          fi
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS (Simulator app)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install web dependencies
        run: npm ci
      - name: Install iOS shell dependencies
        run: npm ci --prefix mobile
      - name: Check shell config
        run: npm run test:native --prefix mobile
      - name: Build and sync web app
        run: npm run build --prefix mobile
      - name: Build iOS Simulator app
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES build
      - name: Package iOS Simulator app
        run: |
          APP=$(find mobile/ios/App/build/Build/Products -name 'App.app' -type d | head -1)
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" scan-ios-simulator.app.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-ios-simulator-app
          path: scan-ios-simulator.app.zip
          if-no-files-found: error
          retention-days: 14
