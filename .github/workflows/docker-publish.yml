name: Publish container

# Builds the single-container image (Deno API + built viewer bundle), boots it,
# gates on /health and the static UI, then pushes to GHCR.
#
# PUBLISHING IS MANUAL. Automatic triggers are gated (see the block below), so
# nothing republishes :latest on its own — and the CI-Marketplace manifest pins
# :latest. After merging anything that changes the image, dispatch this workflow
# from main or the marketplace keeps serving the previous build.
#
# Only a dispatch from main moves :latest; every run also publishes an immutable
# :sha-<short> so a feature-branch build can be tested without touching it.

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     branches: [main]
#     tags: ["*"]
#   pull_request:
#     branches: [main]
#   workflow_dispatch:
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/companionintelligence/ci-web-xr-scan
  INTERNAL_PORT: "8000"

jobs:
  publish:
    name: Build, smoke-test, publish
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          echo "sha_tag=${IMAGE_NAME}:sha-${short}" >> "$GITHUB_OUTPUT"
          # Immutable per-commit tag always; :latest ONLY from main. Without
          # this guard a manual dispatch from any branch would overwrite the
          # tag the marketplace manifest pins.
          tags="${IMAGE_NAME}:sha-${short}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags},${IMAGE_NAME}:latest"
          else
            echo "::notice::ref ${GITHUB_REF} is not main — publishing only :sha-${short}, leaving :latest untouched"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build image (load for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name app -e INFERENCE_MODE=mock -p 8080:${INTERNAL_PORT} ${{ steps.meta.outputs.sha_tag }}

      - name: "Gate: /health reports ok"
        run: |
          for i in $(seq 1 60); do
            body="$(curl -s http://localhost:8080/health || true)"
            if echo "$body" | grep -q '"status":"ok"'; then echo "healthy: $body"; exit 0; fi
            sleep 2
          done
          echo "container never became healthy"; docker logs app; exit 1

      - name: "Gate: static UI served (scanner + editor)"
        run: |
          set -euo pipefail
          for path in / /viewer.html /icon-192.png; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080${path}")"
            [ "$code" = "200" ] || { echo "GET ${path} → ${code}"; docker logs app; exit 1; }
            echo "GET ${path} → 200"
          done

      - name: Container logs (on failure)
        if: failure()
        run: docker logs app || true

      - name: Tear down container
        if: always()
        run: docker rm -f app || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
