apply plugin: 'com.android.application'

// Release signing, from one of two places, all or nothing:
//   1. The environment, as the release workflow sets it: ANDROID_SIGNING_STORE_FILE (a path),
//      ANDROID_SIGNING_STORE_PASSWORD, ANDROID_SIGNING_KEY_ALIAS and ANDROID_SIGNING_KEY_PASSWORD.
//   2. android/keystore.properties (git-ignored), for a local build: storeFile, storePassword,
//      keyAlias and keyPassword.
// With neither, assembleRelease and bundleRelease still build, unsigned: Android will not install
// that APK and Play will not accept that bundle. No key or password lives in this repository.
def signingEnvNames = [
    storeFile    : 'ANDROID_SIGNING_STORE_FILE',
    storePassword: 'ANDROID_SIGNING_STORE_PASSWORD',
    keyAlias     : 'ANDROID_SIGNING_KEY_ALIAS',
    keyPassword  : 'ANDROID_SIGNING_KEY_PASSWORD',
]
def signingFromEnv = signingEnvNames.collectEntries { field, name -> [(field): System.getenv(name)] }
def releaseSigning = null
if (signingFromEnv.values().every { it }) {
    releaseSigning = signingFromEnv
} else if (signingFromEnv.values().any { it }) {
    def missing = signingEnvNames.findAll { field, name -> !signingFromEnv[field] }.values()
    throw new GradleException("Release signing from the environment is incomplete: set ${missing.join(', ')} too, or none of them.")
} else {
    def keystorePropertiesFile = rootProject.file('keystore.properties')
    if (keystorePropertiesFile.exists()) {
        def keystoreProperties = new Properties()
        keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
        releaseSigning = signingEnvNames.keySet().collectEntries { field -> [(field): keystoreProperties[field]] }
    }
}

android {
    namespace = "com.companionintelligence.scan"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.companionintelligence.scan"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // In step with the desktop app's version (scripts/native/check-versions.mjs). versionCode
        // goes up by one with every release.
        versionCode 3
        versionName "0.2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigning) {
                storeFile rootProject.file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// The libraries in the release APK are locked in app/gradle.lockfile, and the app's third-party
// notices list them from it (scripts/native/third-party-notices.mjs). The release build uses the
// versions locked there, and fails when it would take in a library the lockfile does not list or
// leave out one it does, so the notices cannot fall behind the APK. After changing a dependency,
// or Capacitor, run `npx cap sync android` in mobile/ and then, here in mobile/android:
//   ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --write-locks
configurations.matching { it.name == 'releaseRuntimeClasspath' }.configureEach {
    resolutionStrategy.activateDependencyLocking()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
