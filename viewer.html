<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CI XR Scan — 3D Viewer</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%; height: 100%;
        background: #0a0c14;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
      }

      #app {
        display: flex;
        width: 100%; height: 100%;
      }

      /* ── Sidebar ── */
      #sidebar {
        width: 280px;
        min-width: 220px;
        max-width: 340px;
        height: 100%;
        background: rgba(255,255,255,0.04);
        border-right: 1px solid rgba(255,255,255,0.08);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      #sidebar-header {
        padding: 18px 16px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      #sidebar-title {
        font-size: 15px;
        font-weight: 700;
        color: #fff;
      }

      #back-link {
        font-size: 12px;
        color: rgba(255,255,255,0.4);
        text-decoration: none;
        transition: color 0.15s;
      }
      #back-link:hover { color: #4fc3f7; }

      #scan-list {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .scan-item {
        padding: 12px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        cursor: pointer;
        transition: background 0.15s;
      }
      .scan-item:hover { background: rgba(255,255,255,0.05); }
      .scan-item.active { background: rgba(79,195,247,0.1); border-left: 2px solid #4fc3f7; }

      .scan-name {
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 3px;
      }

      .scan-meta {
        font-size: 11px;
        color: rgba(255,255,255,0.35);
      }

      #scan-list-empty {
        padding: 40px 16px;
        text-align: center;
        color: rgba(255,255,255,0.3);
        font-size: 13px;
        line-height: 1.6;
      }

      /* ── Viewport ── */
      #viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      #viewer-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      #viewer-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: rgba(255,255,255,0.2);
        font-size: 14px;
        pointer-events: none;
      }

      #viewer-placeholder .icon {
        font-size: 48px;
        opacity: 0.2;
      }

      /* ── HUD overlays ── */
      #hud-controls {
        position: absolute;
        bottom: 16px;
        right: 16px;
        display: flex;
        gap: 8px;
      }

      .hud-btn {
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.15);
        color: rgba(255,255,255,0.7);
        font-size: 12px;
        padding: 7px 12px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .hud-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

      #hud-info {
        position: absolute;
        top: 12px;
        left: 12px;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 12px;
        color: rgba(255,255,255,0.6);
        line-height: 1.6;
        display: none;
      }
      #hud-info.visible { display: block; }

      /* ── HTML label overlays (pin labels in 3D) ── */
      .label3d {
        position: absolute;
        pointer-events: none;
        background: rgba(0,0,0,0.72);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 11px;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
        transform: translate(-50%, -100%) translateY(-6px);
        backdrop-filter: blur(4px);
      }

      #loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(10,12,20,0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        font-size: 14px;
        color: rgba(255,255,255,0.6);
        display: none;
      }
      #loading-overlay.visible { display: flex; }

      @keyframes spin { to { transform: rotate(360deg); } }
      .spinner {
        width: 28px; height: 28px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #4fc3f7;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
        <div id="sidebar-header">
          <span id="sidebar-title">Saved Scans</span>
          <a href="/" id="back-link">← AR App</a>
        </div>
        <div id="scan-list">
          <div id="scan-list-empty">Loading scans…</div>
        </div>
      </div>

      <div id="viewport">
        <canvas id="viewer-canvas"></canvas>
        <div id="viewer-placeholder">
          <div class="icon">🏠</div>
          <div>Select a scan from the list to view it</div>
          <div style="font-size:12px;opacity:0.6;">Mouse: rotate · Scroll: zoom · Right-click: pan</div>
        </div>
        <div id="hud-info"></div>
        <div id="hud-controls">
          <button class="hud-btn" id="btn-reset-camera">⟳ Reset</button>
          <button class="hud-btn" id="btn-toggle-cloud">☁ Cloud</button>
          <button class="hud-btn" id="btn-toggle-labels">🏷 Labels</button>
        </div>
        <div id="loading-overlay">
          <div class="spinner"></div>
          <span>Loading scan…</span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/viewer/viewer.ts"></script>
  </body>
</html>
