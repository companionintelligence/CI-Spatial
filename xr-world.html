<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Companion Scan — Headset world editor</title>
    <meta name="theme-color" content="#041620" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --ink: #eff0f0;
        --ink-soft: rgba(248,250,252,0.7);
        --accent: #72ddd4;
        --accent-strong: #ffd166;
        --danger: #ff8a80;
        --panel: rgba(4,22,32,0.84);
        --edge: rgba(239,240,240,0.18);
      }

      html, body {
        width: 100%;
        height: 100%;
        background: #041620;
        color: var(--ink);
        font-family: 'Avenir Next', 'Avenir', 'Helvetica Neue', 'Segoe UI', sans-serif;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
      }

      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }

      .hud {
        position: fixed;
        top: 0; left: 0; right: 0;
        padding: 16px 16px 10px;
        background: linear-gradient(180deg, rgba(4,22,32,0.9), rgba(4,22,32,0));
        pointer-events: none;
      }
      .eyebrow {
        color: var(--accent);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      h1 { font-size: 18px; font-weight: 800; margin-top: 4px; overflow-wrap: anywhere; }

      .panel {
        position: fixed;
        left: 12px; right: 12px; bottom: 12px;
        max-width: 480px;
        margin: 0 auto;
        padding: 16px;
        border: 1px solid var(--edge);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: 0 10px 40px rgba(0,0,0,0.35);
      }

      #xr-status {
        font-size: 15px;
        line-height: 1.5;
        color: var(--ink);
        margin-bottom: 12px;
      }
      #xr-status[data-tone="error"] { color: var(--danger); }

      .btn {
        display: block;
        width: 100%;
        min-height: 48px;
        padding: 12px 18px;
        border-radius: 999px;
        border: 1px solid rgba(114,221,212,0.5);
        background: rgba(114,221,212,0.16);
        color: var(--accent);
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn:disabled {
        border-color: var(--edge);
        background: rgba(255,255,255,0.04);
        color: var(--ink-soft);
        cursor: not-allowed;
      }

      .help {
        list-style: none;
        margin-top: 12px;
        font-size: 13px;
        line-height: 1.6;
        color: var(--ink-soft);
      }
      .help strong { color: var(--ink); font-weight: 700; }
    </style>
  </head>
  <body data-mode="preview" data-selected="" data-drag="">
    <div id="stage" aria-hidden="true"></div>

    <header class="hud">
      <div class="eyebrow">Companion Intelligence · Headset editor</div>
      <h1 id="world-name">Loading world…</h1>
    </header>

    <section class="panel" aria-label="Headset session">
      <p id="xr-status" role="status" aria-live="polite">Loading the world…</p>
      <button id="enter-vr" class="btn" type="button" disabled>Enter VR</button>
      <ul class="help">
        <li><strong>Trigger</strong> selects the marker the ray points at</li>
        <li><strong>Thumbstick up or down</strong> changes the selected marker's label</li>
        <li><strong>Grip and move</strong> moves the selected marker; release to save</li>
      </ul>
    </section>

    <script type="module" src="/src/viewer/xr-world.ts"></script>
  </body>
</html>
